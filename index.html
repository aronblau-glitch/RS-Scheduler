<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RS Schedule">
<meta name="theme-color" content="#1a2332">
<title>RS Schedule - Summer 26</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <img src="logo.png" style="width:108px;display:block;margin:0 auto 18px;border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,0.25);" alt="Logo">
    <h1>RS Schedule</h1>
    <p>Summer 26 — Provider Portal</p>
    <label for="loginSelect">Select Your Name</label>
    <select id="loginSelect">
      <option value="">-- Select login --</option>
      <option value="admin">&#128272; Admin</option>
      <option value="office">&#128196; Office</option>
      <option value="Goldberger - SLP">Goldberger - SLP</option>
      <option value="Friedman - SLP">Friedman - SLP</option>
      <option value="Zeigler - SLP">Zeigler - SLP</option>
      <option value="Horowitz - SLP">Horowitz - SLP</option>
      <option value="Herbst - SLP">Herbst - SLP</option>
      <option value="Malks - OT">Malks - OT</option>
      <option value="Dyckman - OT">Dyckman - OT</option>
      <option value="Fischer- CO">Fischer- CO</option>
      <option value="Kerenkraut - CO">Kerenkraut - CO</option>
      <option value="Werner - CO">Werner - CO</option>
      <option value="Weber - CO">Weber - CO</option>
      <option value="Fayersteyn - CO">Fayersteyn - CO</option>
    </select>
    <label for="loginPass">Password</label>
    <input type="password" id="loginPass" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="login-error" id="loginError">Incorrect password. Please try again.</div>
    <div class="remember-row">
      <input type="checkbox" id="rememberMe">
      <label for="rememberMe">Remember me on this device</label>
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
  </div>
</div>

<div id="appScreen" style="display:none;">
  <header class="no-print">
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="logo.png" style="height:36px;border-radius:8px;" alt="Logo">
      <h1>RS Schedule &#8212; Summer 26</h1>
    </div>
    <div class="header-right">
      <span id="headerName"></span>
      <button class="btn-logout" onclick="doLogout()">Sign Out</button>
    </div>
  </header>
  <div class="container">
    <div id="providerView" style="display:none;"></div>
    <div id="adminView" style="display:none;"></div>
    <div id="officeView" style="display:none;"></div>
  </div>
</div>

<div class="modal-overlay no-print" id="sendModal">
  <div class="modal-box">
    <h2>&#128228; Save &amp; Send Report</h2>
    <p id="sendModalDay" class="send-day-label"></p>
    <p>This report will be sent to:</p>
    <div class="email-list" id="emailList"></div>
    <div class="modal-add-row">
      <input type="email" id="newEmailInput" placeholder="Add email address..." onkeydown="if(event.key==='Enter')addEmail()">
      <button class="btn-add-email" onclick="addEmail()">+ Add</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-send" onclick="doSendReport()">Send Report &#9993;</button>
    </div>
  </div>
</div>

<script src="app.js"></script>

<div class="install-banner no-print" id="installBanner">
  <img src="logo.png" style="height:40px;flex-shrink:0;border-radius:8px;" alt="Logo">
  <p><strong>Install RS Schedule</strong>Add to your home screen for quick access.</p>
  <button class="btn-install" id="installBtn">Install</button>
  <button class="btn-dismiss" onclick="hideBanner()">&#10005;</button>
</div>
</body>
</html>
